<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Free Japanese-English dictionary with pitch accent, JLPT levels and kanji lookup." />
		<title>Yomidachi Dictionary</title>
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/favicon-32x32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/icons/favicon-16x16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Loaded off the render path; system-ui shows until the font arrives. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
		</noscript>
		<link rel="stylesheet" href="/src/styles/app.css" />
		<script>
			// Before first paint, so the page never flashes the wrong theme.
			try {
				var stored = localStorage.getItem("theme");
				var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme = dark ? "dark" : "light";
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
